name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Verify Python & Pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Verify compilation
        run: python -m compileall src tests

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff formatting verification
        run: ruff format --check .

      - name: Run test suite with pytest & coverage
        run: |
          pytest --cov=rpx --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: CLI smoke test
        run: |
          rpx --version
          rpx --help
          rpx scan . --no-cache --quiet

      - name: Job Summary
        if: always()
        shell: bash
        run: |
          echo "### Test Matrix Result" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: \`${{ matrix.python-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed successfully :white_check_mark:" >> $GITHUB_STEP_SUMMARY

  package-and-security:
    name: Package Validation & Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install build, packaging, and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit .

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check --strict dist/*

      - name: Verify clean wheel installation
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          rpx --version
          rpx --help
          rpx scan . --no-cache --quiet
          deactivate

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

      - name: Job Summary
        run: |
          echo "### Package & Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **pip-audit**: Passed without vulnerabilities :shield:" >> $GITHUB_STEP_SUMMARY
          echo "- **Twine check**: Strict metadata validation passed :package:" >> $GITHUB_STEP_SUMMARY
          echo "- **Wheel installation**: Clean venv smoke test passed :rocket:" >> $GITHUB_STEP_SUMMARY

