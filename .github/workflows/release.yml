name: Release Automation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validate, Test & Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Validate tag version matches pyproject.toml
        run: |
          TAG_REF="${{ github.ref_name }}"
          TAG_VERSION="${TAG_REF#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Git Tag: $TAG_REF (version $TAG_VERSION)"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)!"
            exit 1
          fi
          echo "Tag and package metadata version matched successfully."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine pip-audit

      - name: Verify Ruff lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: pytest -ra -q

      - name: Audit dependencies for vulnerabilities
        run: pip-audit .

      - name: Build sdist and wheel distributions
        run: python -m build

      - name: Validate distribution metadata with Twine
        run: twine check --strict dist/*

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: release_notes
        run: |
          python - << 'EOF'
          import re
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          changelog_path = Path("CHANGELOG.md")

          notes = ""
          if changelog_path.is_file():
              content = changelog_path.read_text(encoding="utf-8")
              pattern = rf"##\s*\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = f"Release {tag} of RPX (Repository Project Explorer).\n\nSee [CHANGELOG.md](https://github.com/VinitSurve/rpx/blob/main/CHANGELOG.md) for full details."

          install_info = (
              "\n\n### Installation\n\n"
              "```bash\n"
              "# Using pipx (recommended)\n"
              "pipx install rpx\n\n"
              "# Using uv\n"
              "uv tool install rpx\n\n"
              "# Using pip\n"
              "pip install rpx\n"
              "```\n"
          )

          full_notes = notes + install_info
          Path("RELEASE_NOTES.md").write_text(full_notes, encoding="utf-8")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386ac524228f4705d7 # v2.2.1
        with:
          name: RPX ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [validate-and-build, github-release]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/rpx
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52e663f01b56e1b989944ba7547773e4330ff # v1.12.4
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

