[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpx"
version = "1.0.0"
description = "Repository Project Explorer | Comprehensive local-first developer utility for software project analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vinit", email = "vinit@example.com" }
]
keywords = [
    "cli", "developer-tools", "project-explorer", "code-metrics",
    "loc", "git-analytics", "dependencies", "project-health"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.5.0",
    "pathspec>=0.11.0",
    "packaging>=23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pip-audit>=2.10.1"
]

[project.scripts]
rpx = "rpx.cli:main"

[project.urls]
Homepage = "https://github.com/VinitSurve/rpx"
Repository = "https://github.com/VinitSurve/rpx"
Issues = "https://github.com/VinitSurve/rpx/issues"
Documentation = "https://github.com/VinitSurve/rpx#readme"
Changelog = "https://github.com/VinitSurve/rpx/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
